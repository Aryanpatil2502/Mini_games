<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 422" width="448" height="422" role="img" aria-label="Number memory game" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#312e81" flood-opacity="0.25"/>
    </filter>
    <g id="down">
      <rect width="80" height="90" rx="10" fill="#4f46e5" filter="url(#shadow)"/>
      <rect x="8" y="8" width="64" height="74" rx="6" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="2"/>
      <text x="40" y="57" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#fff" fill-opacity="0.85">?</text>
    </g>
  </defs>

  <rect width="448" height="422" rx="20" fill="#f5f3ff"/>
  <text x="224" y="52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#312e81">Memory Game</text>

  <!-- Row 1 -->
  <use href="#down" x="40" y="80"/>
  <g transform="translate(136,80)" filter="url(#shadow)">
    <rect width="80" height="90" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="4"/>
    <text x="40" y="59" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#b45309">3</text>
  </g>
  <g transform="translate(232,80)" filter="url(#shadow)">
    <rect width="80" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <text x="40" y="59" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#15803d">5</text>
  </g>
  <use href="#down" x="328" y="80"/>

  <!-- Row 2 -->
  <g transform="translate(40,186)" filter="url(#shadow)">
    <rect width="80" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <text x="40" y="59" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#15803d">5</text>
  </g>
  <use href="#down" x="136" y="186"/>
  <g transform="translate(232,186)" filter="url(#shadow)">
    <rect width="80" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <text x="40" y="59" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#15803d">2</text>
  </g>
  <use href="#down" x="328" y="186"/>

  <!-- Row 3 -->
  <use href="#down" x="40" y="292"/>
  <g transform="translate(136,292)" filter="url(#shadow)">
    <rect width="80" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <text x="40" y="59" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#15803d">2</text>
  </g>
  <use href="#down" x="232" y="292"/>
  <use href="#down" x="328" y="292"/>
</svg>
